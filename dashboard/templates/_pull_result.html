{# Pull 정상 완료는 app.py 가 204 로 응답해 swap 자체가 안 일어남 — 여기는 안 그려진다.
   실패/skip 만 사용자에게 알린다. #}
{% if res.skipped %}
<div class="pull-result ok">
  ⏳ Pull 진행 중 (이전 요청 살아 있음 — 이번 요청은 skip)
  <p class="muted">완료되면 새로고침해서 최신 snapshot 반영하세요.</p>
</div>
{% else %}
<div class="pull-result err">
  ❌ Pull 실패 (rc={{ res.rc }})
  <details open>
    <summary>출력 보기</summary>
    <pre>{{ res.output }}</pre>
  </details>
</div>
{% endif %}
