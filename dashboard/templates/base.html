<!doctype html>
<html lang="ko" data-theme="light" data-theme-preset="default" data-theme-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}notice-watcher dashboard{% endblock %}</title>
  <script>
    // FOUC 방지용 inline loader — Pico CSS 가 로드되기 전에 html 속성을 먼저 박는다.
    (function () {
      try {
        var p = localStorage.getItem('nw.themePreset') || 'default';
        var s = localStorage.getItem('nw.themeSize')   || 'normal';
        var m = localStorage.getItem('nw.themeMode')   || 'light'; // light|dark|auto
        var root = document.documentElement;
        root.setAttribute('data-theme-preset', p);
        root.setAttribute('data-theme-size', s);
        if (m === 'auto') {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } else {
          root.setAttribute('data-theme', m);
        }
      } catch (e) { /* localStorage 막혀도 silent */ }
    })();
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h3 class="brand">📡 notice-watcher</h3>
      <nav>
        <ul>
          <li><a href="/" class="{{ 'active' if active=='triage' else '' }}">📊 Triage</a></li>
          <li><a href="/jobs" class="{{ 'active' if active=='jobs' else '' }}">📋 Jobs</a></li>
          <li><a href="/subs" class="{{ 'active' if active=='subs' else '' }}">🔗 Subs</a></li>
          <li><a href="/users" class="{{ 'active' if active=='users' else '' }}">👥 Users</a></li>
          <li><a href="/reports" class="{{ 'active' if active=='reports' else '' }}">🐛 Reports</a></li>
          <li><a href="/cases" class="{{ 'active' if active=='cases' else '' }}">📒 Cases</a></li>
          <li><a href="/learned" class="{{ 'active' if active=='learned' else '' }}">🧠 Learned</a></li>
          <li><a href="/bugs" class="{{ 'active' if active=='bugs' else '' }}">🐞 Bugs</a></li>
          <li><a href="/feedback" class="{{ 'active' if active=='feedback' else '' }}">💬 Feedback</a></li>
          <li><a href="/usage" class="{{ 'active' if active=='usage' else '' }}">💸 Usage</a></li>
          <li><a href="/timings" class="{{ 'active' if active=='timings' else '' }}">⏱ Timings</a></li>
          <li><a href="/history" class="{{ 'active' if active=='history' else '' }}">🕘 History</a></li>
          <li><a href="/control" class="{{ 'active' if active=='control' else '' }}">🎛 Control</a></li>
          <li><a href="/settings" class="{{ 'active' if active=='settings' else '' }}">⚙ Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="snap">
          <span class="muted">snapshot:</span> <code>{{ snapshot_ts }}</code>
        </div>
        <span id="auto-pull"
              hx-post="/actions/pull"
              hx-trigger="load once"
              hx-target="#pull-result"
              hx-swap="innerHTML"
              hx-indicator="#pull-spinner"></span>
        <span class="muted">🔄 자동 Pull</span>
        <span id="pull-spinner" class="htmx-indicator">…진행중</span>
      </header>

      <div id="pull-result" aria-live="polite"></div>

      {% block body %}{% endblock %}
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="{{ request.url_for('static', path='app.js') }}"></script>
</body>
</html>
