# 운영 튜닝값 (repo 기본, 모든 머신 공통). 비밀(BOT_TOKEN/GEMINI_API_KEYS 등)은 .env 에.
#
# 머신별로 다른 값 쓰고 싶으면 같은 폴더에 config.local.toml 만들고 일부 키만 적기.
# 예: dev박스에서 chromium 동시 4개 돌리고 싶다면
#   # config.local.toml
#   [poll]
#   concurrency_chromium = 4
# → config.local.toml 의 값이 config.toml 을 덮어씀. 안 적은 키는 config.toml 값 그대로.
#
# 로더: bot/runtime_config.py.  변경 후 봇/폴링 재시작 필요(import 시점에 한 번 읽음).

[poll]
# 사이트 동시 fetch 상한. chromium=playwright_html + ArcaLiveAdapter(handwritten), 그 외는 httpx.
concurrency_httpx = 8        # httpx 사이트 — 가벼움(httpx + bs4), 늘려도 메모리 부담 X
concurrency_chromium = 1     # chromium 사이트 — 1개당 RAM ~200MB+, N100(12GiB) 보호용
page_size = 30               # fetch_list 첫 페이지 크기
max_new_articles = 10        # 폴링 1회당 본문 fetch 상한 (사이트당)
breakage_threshold = 2       # 연속 N회 깨지면 reprobe 잡 enqueue
reprobe_fail_streak_limit = 3  # reprobe 가 N회 연속 fail 이면 .BUG.json 자동 박아 자동 재시도 차단 (운영자 review 대기)
broken_threshold = 3         # 연속 N회 깨지면 .BROKEN.json health sidecar — deliver_due 가 사용자에 "❗ 깨졌어요" 안내 (notify_empty=1 구독만). dashboard `/triage/broken` 큐.
seen_cap = 5000              # seen_post_ids 무한 증가 방지 상한

[worker]
idle_poll_seconds = 2.0      # 잡 큐 비었을 때 sleep 주기 (낮으면 응답 빠르지만 DB poll 잦음)

[chromium_lock]
# 모두 초 단위.
bot_timeout = 900            # 봇 register 잡이 락 대기 한도 (= Discord interaction defer token 만료 15분)
poll_timeout = 1800          # 폴링이 락 대기 한도 (chromium_lock 풀릴 때까지; 봇 worker 가 처리 중일 수 있음)
register_subprocess_timeout = 600   # register.py 실행 자체 한도 — 넘으면 SIGKILL

[notify]
delivered_cap = 5000         # bot.sqlite3 의 deliveries 한도 (오래된 거 잘림)
# notify 의 summarize/filter LLM 호출을 ThreadPoolExecutor 로 병렬화할 때 동시 호출 상한.
# 1 로 내리면 옛 sequential 동작 회귀. paid Gemini Tier 1 (4000 RPM) 한참 밑이라 8 안전.
# ChatGPT Plus quota burst 발생 시 임시로 낮춰 핫픽스 가능.
llm_concurrency = 8

[rate_limit]
# 사용자 1명이 /preview·/watch 로 register 잡을 짧게 폭주 시키는 걸 막는다 (bot/main.py::_check_rate_limit
# + _check_queue_depth 가 _gate_check 안에서 검사 → 초과면 사용자에 안내, 워커 큐 enqueue 안 함).
# 비공개·로그인필요 사이트 100개 던지면 chromium_lock 직렬 + LLM 비용 폭증 — 그 시나리오 차단.
# 각 값 ≤0 이면 그 검사 끔.
per_user_per_hour = 10       # 시간당 동일 사용자 register 잡 enqueue 상한
per_user_per_day = 30        # 24h 동일 사용자 register 잡 enqueue 상한
queue_depth_cap = 100        # 워커 큐 pending 잡 전역 상한 — 초과 시 새 enqueue reject (전 사용자 폭주 시 봇 자체 보호)

[register]
# scripts/register.py 가 LLM(gemini)으로 config 생성 시도할 횟수.
# 한 번 실패당 입력+출력 토큰 한 round = 비용 발생. 4회 실패 시 .FAILED.json 로 떨어짐.
# 줄이면 비용↓ 성공률↓, 늘리면 비용↑ 성공률↑(diminishing return — 보통 1~2회에 성공하거나 안 되거나).
# CLI 의 --max-attempts 가 이 값을 override.
max_attempts = 4

[prune]
# scripts/prune_probe.py (cron 으로 호출) 가 output/probe/<slug>/ 디스크 정리할 기준.
# .FAILED.json 동반 + age 초과면 그 사이트 어차피 처리 안 됨 → 산출물 prune.
# 0 이하면 그 카테고리 prune 끔.
probe_failed_max_age_days = 30
probe_unregistered_max_age_days = 90
