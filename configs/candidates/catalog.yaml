# 출처: `docs/[연구] 게시판 형태 플랫폼 크롤링 분류 가이드 …` (provenance=doc)
#       `docs/사이트별 등록 시도 기록.md` (provenance=history)
#       WebSearch 보강 (provenance=web)
#
