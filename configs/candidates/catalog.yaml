# tier 의미 (arXiv 2601.06301 5-tier):
#   A=정적HTML, B=서버렌더+hydration, C=SPA+JSON XHR, D=SPA+auth/CSRF,
#   E=Heavy SPA+bot보호(Cloudflare), F=iframe-in-iframe, G=CAPTCHA-gated.
#
# expected_strategy: rss | httpx_json | httpx_html | playwright_html | handwritten | unknown.

